
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: supportdesk-verify-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Local_Dev_Password1}"
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:1434:1433"
    volumes:
      - verify-sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q 'SELECT 1' || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    image: northwind-support-api:latest
    container_name: supportdesk-verify-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=SupportDesk;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Local_Dev_Password1};TrustServerCertificate=True"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in your local .env file}"
      Jwt__Issuer: NorthwindSupportDesk
      Jwt__Audience: NorthwindSupportDesk
      Jwt__TokenLifetimeMinutes: "480"
    ports:
      - "127.0.0.1:5081:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  verify-sql-data:
